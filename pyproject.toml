[project]
name = "elsewhere"
version = "0.1.0"
description = "A persistent world that remembers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["mcp>=2.3", "openai>=1.0", "networkx>=3.0", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# sqlean.py: a SQLite that can load sqlite-vec, which python.org's macOS Python cannot.
mlx = ["mlx-lm>=0.31", "mlx-embeddings>=0.1", "llguidance>=1.8", "sqlite-vec>=0.1.6",
       "sqlean.py>=3.45"]
recall = ["sqlite-vec>=0.1.6", "sqlean.py>=3.45"]
dev = ["mypy>=1.8", "black>=24.0"]

[project.scripts]
elsewhere = "elsewhere.interface.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The logo the window opens on, drawn by scripts/logo.py.
"elsewhere.interface.tui" = ["logo.json.xz"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
files = ["src/elsewhere"]
# Not strict: only here to catch stale attributes in code no test reaches.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "mlx_embeddings", "mlx_embeddings.*",
          "llguidance", "llguidance.*", "huggingface_hub", "sqlite_vec", "sqlean", "networkx", "numpy"]
ignore_missing_imports = true
