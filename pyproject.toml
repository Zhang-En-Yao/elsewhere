[project]
name = "elsewhere"
version = "2.0"
description = "A persistent world that remembers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mlx = ["mlx-lm>=0.31", "mlx-embeddings>=0.1", "llguidance>=1.8"]
dev = ["mypy>=1.8"]

[project.scripts]
elsewhere = "elsewhere.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src/elsewhere"]
# Not strict: only here to catch stale attributes in code no test reaches.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional extras.
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "mlx_embeddings", "mlx_embeddings.*",
          "llguidance", "llguidance.*", "huggingface_hub"]
ignore_missing_imports = true
