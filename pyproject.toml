[project]
name = "elsewhere"
version = "2.0"
description = "A persistent world that remembers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mlx = ["mlx-lm>=0.31", "mlx-embeddings>=0.1", "llguidance>=1.8"]
dev = ["mypy>=1.8"]

[project.scripts]
elsewhere = "elsewhere.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src/elsewhere"]
# Not strict. The one thing this is here for is the class of mistake a test
# cannot reach: an attribute that stopped existing, in code nothing calls.
# Chronicle.all() is annotated, so `e.day` on an Event is an error the day
# it is written rather than whenever somebody next reads the file.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The Claude backend is an optional extra; it is expected to be missing.
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# So is MLX, which only exists on Apple silicon.
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "mlx_embeddings", "mlx_embeddings.*",
          "llguidance", "llguidance.*", "huggingface_hub"]
ignore_missing_imports = true
